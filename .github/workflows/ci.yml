name: CI and GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: mypy
        run: mypy src tests
      - name: pytest
        run: pytest -q -p no:cacheprovider
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  container:
    name: Container build and smoke
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: nzbget-sab-bridge:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nzbget-sab-bridge:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln
          version: v0.76.1
      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker rm -f bridge-ci || true
          docker run -d --name bridge-ci \
            -p 6791:6789 \
            -v bridge-ci-data:/data \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --security-opt no-new-privileges \
            --cap-drop=ALL \
            -e MODE=bridge \
            -e LISTEN_HOST=0.0.0.0 \
            -e LISTEN_PORT=6789 \
            -e DATA_DIR=/data \
            -e NZBGET_USERNAME=ci-user \
            -e NZBGET_PASSWORD=ci-password-not-real \
            -e SABNZBD_URL=http://127.0.0.1:9 \
            -e SABNZBD_API_KEY=ci-api-key-not-real \
            -e READYZ_CHECK_SAB=false \
            -e LOG_LEVEL=INFO \
            -e LOG_FORMAT=json \
            nzbget-sab-bridge:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6791/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:6791/healthz
          curl -fsS http://127.0.0.1:6791/readyz
          docker rm -f bridge-ci

  unraid:
    name: Unraid template and assets
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate template and icon
        run: python scripts/validate_unraid_template.py

  publish:
    name: Publish GHCR image
    runs-on: ubuntu-latest
    needs: [checks, container, unraid]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite existing version tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/nzbget-sab-bridge"
          version="${GITHUB_REF_NAME#v}"
          for ref in "${GITHUB_REF_NAME}" "${version}"; do
            if docker buildx imagetools inspect "$image:$ref" >/dev/null 2>&1; then
              echo "::error::Refusing to overwrite existing image tag $image:$ref"
              exit 1
            fi
          done
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/nzbget-sab-bridge
          # latest is promoted only by the version-gated promote-latest job.
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote-latest:
    name: Promote verified release to latest
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: ghcr-latest-promotion
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke the published version image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/nzbget-sab-bridge
        run: |
          set -euo pipefail
          docker pull "$IMAGE:${GITHUB_REF_NAME}"
          docker rm -f bridge-release-smoke || true
          docker volume rm bridge-release-smoke-data >/dev/null 2>&1 || true
          docker run -d --name bridge-release-smoke \
            -p 6799:6789 \
            -v bridge-release-smoke-data:/data \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --security-opt no-new-privileges \
            --cap-drop=ALL \
            -e MODE=bridge \
            -e LISTEN_HOST=0.0.0.0 \
            -e LISTEN_PORT=6789 \
            -e DATA_DIR=/data \
            -e NZBGET_USERNAME=release-smoke-user \
            -e NZBGET_PASSWORD=release-smoke-password-not-real \
            -e SABNZBD_URL=http://127.0.0.1:9 \
            -e SABNZBD_API_KEY=release-smoke-api-key-not-real \
            -e READYZ_CHECK_SAB=false \
            -e LOG_LEVEL=INFO \
            -e LOG_FORMAT=json \
            "$IMAGE:${GITHUB_REF_NAME}"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6799/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:6799/healthz
          curl -fsS http://127.0.0.1:6799/readyz
          docker rm -f bridge-release-smoke
          docker volume rm bridge-release-smoke-data >/dev/null
      - name: Decide whether latest may advance
        id: policy
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/nzbget-sab-bridge
        run: |
          set -euo pipefail
          python3 scripts/release_policy.py             --image "$IMAGE"             --candidate "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"
      - name: Promote latest only when newer
        if: steps.policy.outputs.promote == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/nzbget-sab-bridge
        run: |
          set -euo pipefail
          docker buildx imagetools create             -t "$IMAGE:latest"             "$IMAGE:${GITHUB_REF_NAME}"
