name: CI and GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: mypy
        run: mypy src tests
      - name: pytest
        run: pytest -q -p no:cacheprovider

  container:
    name: Container build and smoke
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: nzbget-sab-bridge:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker rm -f bridge-ci || true
          docker run -d --name bridge-ci \
            -p 6791:6789 \
            -v bridge-ci-data:/data \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --security-opt no-new-privileges \
            --cap-drop=ALL \
            -e MODE=bridge \
            -e LISTEN_HOST=0.0.0.0 \
            -e LISTEN_PORT=6789 \
            -e DATA_DIR=/data \
            -e NZBGET_USERNAME=ci-user \
            -e NZBGET_PASSWORD=ci-password-not-real \
            -e SABNZBD_URL=http://127.0.0.1:9 \
            -e SABNZBD_API_KEY=ci-api-key-not-real \
            -e READYZ_CHECK_SAB=false \
            -e LOG_LEVEL=INFO \
            -e LOG_FORMAT=json \
            nzbget-sab-bridge:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6791/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:6791/healthz
          curl -fsS http://127.0.0.1:6791/readyz
          docker rm -f bridge-ci

  unraid:
    name: Unraid template and assets
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate template and icon
        run: python scripts/validate_unraid_template.py

  publish:
    name: Publish GHCR image
    runs-on: ubuntu-latest
    needs: [checks, container, unraid]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/nzbget-sab-bridge
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
