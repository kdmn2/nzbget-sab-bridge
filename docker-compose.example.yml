services:
  bridge:
    # Pin a versioned tag for rollback; latest is the tested release channel.
    image: ${BRIDGE_IMAGE:-ghcr.io/kdmn2/nzbget-sab-bridge:latest}
    env_file:
      - .env
    ports:
      - "${BRIDGE_PORT:-6790}:6789"
    volumes:
      - bridge_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "nzbget_sab_bridge.healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  bridge_data:
