services:
  bridge:
    build: .
    image: nzbget-sab-bridge:local
    env_file:
      - "${ENV_FILE:-.env}"
    ports:
      - "${BRIDGE_BIND_IP:-0.0.0.0}:${BRIDGE_PORT:-6790}:6789"
    volumes:
      - bridge_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - usenet
    healthcheck:
      test: ["CMD", "python", "-m", "nzbget_sab_bridge.healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  bridge_data:

networks:
  usenet:
    external: true
